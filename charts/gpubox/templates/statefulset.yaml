{{- $sshAuthorizedKeysEnabled := or (gt (len .Values.ssh.authorizedKeys) 0) .Values.ssh.existingAuthorizedKeysConfigMap -}}
{{- $tailscaleEnabled := .Values.tailscale.enabled -}}
{{- $dnsEnabled := .Values.dns.enabled -}}
{{- $dnsContainerNames := dict "dns-setup" true "dns-controller" true "dns" true -}}
{{- $dnsVolumeNames := dict "gpubox-dns" true "gpubox-dns-controller" true "gpubox-dns-controller-source" true "gpubox-tailscale-socket" true -}}
{{- $dnsMountPaths := list "/etc/resolv.conf" "/var/run/gpubox-dns" "/run/gpubox-dns" "/opt/gpubox-dns" "/opt/gpubox-dns-source" "/var/run/gpubox-tailscale" "/run/gpubox-tailscale" -}}
{{- $dnsPorts := dict "53" true "8080" true "8181" true -}}
{{- if $dnsEnabled -}}
{{- if semverCompare "<1.34-0" .Capabilities.KubeVersion.Version -}}
{{- fail "dns.enabled=true requires Kubernetes 1.34 or newer" -}}
{{- end -}}
{{- if .Values.pod.hostNetwork -}}
{{- fail "dns.enabled=true is incompatible with pod.hostNetwork=true" -}}
{{- end -}}
{{- if .Values.serviceAccount.automountServiceAccountToken -}}
{{- fail "dns.enabled=true requires serviceAccount.automountServiceAccountToken=false" -}}
{{- end -}}
{{- if hasKey .Values.podAnnotations "checksum/dns-controller" -}}
{{- fail "podAnnotations cannot override managed annotation checksum/dns-controller" -}}
{{- end -}}
{{- if or (eq (trim .Values.dns.image.repository) "") (eq (trim .Values.dns.image.tag) "") -}}
{{- fail "dns.enabled=true requires non-empty dns.image.repository and dns.image.tag" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.dns.image.digest) -}}
{{- fail "dns.enabled=true requires dns.image.digest to be a sha256 digest" -}}
{{- end -}}
{{- if hasKey $dnsContainerNames (include "gpubox.name" .) -}}
{{- fail (printf "application container cannot use managed DNS container name %s" (include "gpubox.name" .)) -}}
{{- end -}}
{{- range $containerKind := list "initContainers" "sidecars" -}}
{{- range (get $.Values $containerKind) -}}
{{- if kindIs "map" . -}}
{{- if not (hasKey . "name") -}}
{{- fail (printf "%s entries require a name matching Kubernetes DNS label syntax" $containerKind) -}}
{{- end -}}
{{- $containerNameValue := get . "name" -}}
{{- if not (kindIs "string" $containerNameValue) -}}
{{- fail (printf "%s name must be a string matching Kubernetes DNS label syntax" $containerKind) -}}
{{- end -}}
{{- $containerName := default "" $containerNameValue -}}
{{- if or (gt (len $containerName) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $containerName)) -}}
{{- fail (printf "%s name %q must match Kubernetes DNS label syntax and contain at most 63 characters" $containerKind $containerName) -}}
{{- end -}}
{{- if hasKey $dnsContainerNames $containerName -}}
{{- fail (printf "%s cannot use managed DNS container name %s" $containerKind $containerName) -}}
{{- end -}}
{{- range (default (list) (get . "ports")) -}}
{{- if and (kindIs "map" .) (hasKey $dnsPorts (toString (default 0 (get . "containerPort")))) -}}
{{- fail (printf "%s cannot declare managed DNS port %v" $containerKind (get . "containerPort")) -}}
{{- end -}}
{{- end -}}
{{- range (default (list) (get . "volumeMounts")) -}}
{{- if kindIs "map" . -}}
{{- $volumeName := default "" (get . "name") -}}
{{- if hasKey $dnsVolumeNames $volumeName -}}
{{- fail (printf "%s cannot mount managed DNS volume %s" $containerKind $volumeName) -}}
{{- end -}}
{{- $rawMountPath := default "" (get . "mountPath") -}}
{{- $mountPath := clean $rawMountPath -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath "/etc/resolv.conf") (hasPrefix (printf "%s/" $mountPath) "/etc/resolv.conf")) -}}
{{- fail (printf "%s cannot shadow managed resolver path /etc/resolv.conf" $containerKind) -}}
{{- end -}}
{{- range $managedPath := $dnsMountPaths -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath $managedPath) (hasPrefix (printf "%s/" $mountPath) $managedPath) (hasPrefix (printf "%s/" $managedPath) $mountPath)) -}}
{{- fail (printf "%s cannot conflict with managed DNS mount path %s" $containerKind $rawMountPath) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range .Values.containerPorts -}}
{{- if and (kindIs "map" .) (hasKey $dnsPorts (toString (default 0 (get . "containerPort")))) -}}
{{- fail (printf "containerPorts cannot declare managed DNS port %v" (get . "containerPort")) -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumes -}}
{{- if and (kindIs "map" .) (hasKey $dnsVolumeNames (default "" (get . "name"))) -}}
{{- fail (printf "extraVolumes cannot use managed DNS volume name %s" (get . "name")) -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumeMounts -}}
{{- if kindIs "map" . -}}
{{- $volumeName := default "" (get . "name") -}}
{{- if hasKey $dnsVolumeNames $volumeName -}}
{{- fail (printf "extraVolumeMounts cannot mount managed DNS volume %s" $volumeName) -}}
{{- end -}}
{{- $rawMountPath := default "" (get . "mountPath") -}}
{{- $mountPath := clean $rawMountPath -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath "/etc/resolv.conf") (hasPrefix (printf "%s/" $mountPath) "/etc/resolv.conf")) -}}
{{- fail "extraVolumeMounts cannot shadow managed resolver path /etc/resolv.conf" -}}
{{- end -}}
{{- range $managedPath := $dnsMountPaths -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath $managedPath) (hasPrefix (printf "%s/" $mountPath) $managedPath) (hasPrefix (printf "%s/" $managedPath) $mountPath)) -}}
{{- fail (printf "extraVolumeMounts cannot conflict with managed DNS mount path %s" $rawMountPath) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range (list .Values.persistence.home .Values.persistence.transfer .Values.persistence.tmp .Values.persistence.hostRoot) -}}
{{- if and (kindIs "map" .) (get . "enabled") -}}
{{- $rawMountPath := default "" (get . "mountPath") -}}
{{- $mountPath := clean $rawMountPath -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath "/etc/resolv.conf") (hasPrefix (printf "%s/" $mountPath) "/etc/resolv.conf")) -}}
{{- fail (printf "persistence mount %s cannot shadow managed resolver path /etc/resolv.conf" $rawMountPath) -}}
{{- end -}}
{{- range $managedPath := $dnsMountPaths -}}
{{- if and (ne $mountPath ".") (or (eq $mountPath "/") (eq $mountPath $managedPath) (hasPrefix (printf "%s/" $mountPath) $managedPath) (hasPrefix (printf "%s/" $managedPath) $mountPath)) -}}
{{- fail (printf "persistence mount %s conflicts with managed DNS mount path" $rawMountPath) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $tailscaleEnabled -}}
{{- $rawMountPath := $.Values.tailscale.state.mountPath -}}
{{- $mountPath := clean $rawMountPath -}}
{{- range $managedPath := $dnsMountPaths -}}
{{- if or (eq $mountPath "/") (eq $mountPath $managedPath) (hasPrefix (printf "%s/" $mountPath) $managedPath) (hasPrefix (printf "%s/" $managedPath) $mountPath) -}}
{{- fail (printf "tailscale.state.mountPath cannot conflict with managed DNS mount path %s" $rawMountPath) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $tailscaleEnabled .Values.tailscale.acceptDNS (not $dnsEnabled) -}}
{{- fail "tailscale.acceptDNS=true requires dns.enabled=true" -}}
{{- end -}}
{{- if $tailscaleEnabled -}}
{{- if ne .Values.tailscale.authKey.value (trim .Values.tailscale.authKey.value) -}}
{{- fail "tailscale.authKey.value must not contain leading or trailing whitespace" -}}
{{- end -}}
{{- if ne .Values.tailscale.authKey.existingSecret (trim .Values.tailscale.authKey.existingSecret) -}}
{{- fail "tailscale.authKey.existingSecret must not contain leading or trailing whitespace" -}}
{{- end -}}
{{- if ne .Values.tailscale.state.existingClaim (trim .Values.tailscale.state.existingClaim) -}}
{{- fail "tailscale.state.existingClaim must not contain leading or trailing whitespace" -}}
{{- end -}}
{{- $inlineAuthKey := ne (trim .Values.tailscale.authKey.value) "" -}}
{{- $existingAuthSecret := ne (trim .Values.tailscale.authKey.existingSecret) "" -}}
{{- if eq $inlineAuthKey $existingAuthSecret -}}
{{- fail "tailscale.enabled=true requires exactly one of tailscale.authKey.value or tailscale.authKey.existingSecret" -}}
{{- end -}}
{{- if semverCompare "<1.29-0" .Capabilities.KubeVersion.Version -}}
{{- fail "tailscale.enabled=true requires Kubernetes 1.29 or newer with the SidecarContainers feature enabled" -}}
{{- end -}}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "tailscale.enabled=true requires replicaCount=1 because the managed state PVC cannot be shared" -}}
{{- end -}}
{{- if .Values.pod.hostNetwork -}}
{{- fail "tailscale.enabled=true is incompatible with pod.hostNetwork=true" -}}
{{- end -}}
{{- if .Values.serviceAccount.automountServiceAccountToken -}}
{{- fail "tailscale.enabled=true requires serviceAccount.automountServiceAccountToken=false" -}}
{{- end -}}
{{- if or (eq (trim .Values.tailscale.image.repository) "") (eq (trim .Values.tailscale.image.tag) "") -}}
{{- fail "tailscale.enabled=true requires non-empty tailscale.image.repository and tailscale.image.tag" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.tailscale.image.digest) -}}
{{- fail "tailscale.enabled=true requires tailscale.image.digest to be a sha256 digest" -}}
{{- end -}}
{{- if not .Values.tailscale.securityContext.privileged -}}
{{- fail "tailscale.enabled=true requires tailscale.securityContext.privileged=true" -}}
{{- end -}}
{{- if not .Values.tailscale.sysctl.securityContext.privileged -}}
{{- fail "tailscale.enabled=true requires tailscale.sysctl.securityContext.privileged=true" -}}
{{- end -}}
{{- $reservedTailscaleEnv := dict "POD_NAME" true "TS_AUTHKEY" true "TS_CLIENT_ID" true "TS_CLIENT_SECRET" true "TS_ID_TOKEN" true "TS_AUDIENCE" true "TS_KUBE_SECRET" true "TS_STATE_DIR" true "TS_USERSPACE" true "TS_ACCEPT_DNS" true "TS_AUTH_ONCE" true "TS_HOSTNAME" true "TS_EXTRA_ARGS" true "TS_TAILSCALED_EXTRA_ARGS" true "TS_ENABLE_HEALTH_CHECK" true "TS_LOCAL_ADDR_PORT" true "TS_ROUTES" true "TS_DEST_IP" true "TS_TAILNET_TARGET_IP" true "TS_TAILNET_TARGET_FQDN" true "TS_SOCKS5_SERVER" true "TS_OUTBOUND_HTTP_PROXY_LISTEN" true "TS_SERVE_CONFIG" true "TS_SOCKET" true -}}
{{- range .Values.tailscale.extraEnv -}}
{{- $envName := default "" (get . "name") -}}
{{- if hasKey $reservedTailscaleEnv $envName -}}
{{- fail (printf "tailscale.extraEnv cannot override chart-managed or unsupported authentication variable %s" $envName) -}}
{{- end -}}
{{- end -}}
{{- range .Values.tailscale.extraArgs -}}
{{- if regexMatch "[[:space:]]" . -}}
{{- fail (printf "tailscale.extraArgs entries must each contain one whitespace-free flag: %s" .) -}}
{{- end -}}
{{- if regexMatch "^-+(accept-dns|accept-routes|advertise-connector|advertise-exit-node|advertise-routes|audience|auth-key|client-id|client-secret|exit-node|exit-node-allow-lan-access|force-reauth|hostname|id-token|login-server|netfilter-mode|operator|qr|qr-format|reset|shields-up|snat-subnet-routes|socket|ssh|state|stateful-filtering|tun)(=|$)" . -}}
{{- fail (printf "tailscale.extraArgs cannot override chart-managed or unsupported flag %s" .) -}}
{{- end -}}
{{- end -}}
{{- range .Values.initContainers -}}
{{- if kindIs "map" . -}}
{{- if or (eq (default "" (get . "name")) "tailscale") (eq (default "" (get . "name")) "tailscale-sysctl") -}}
{{- fail (printf "initContainers cannot use managed Tailscale container name %s" (get . "name")) -}}
{{- end -}}
{{- range (default (list) (get . "volumeMounts")) -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "name")) "tailscale-state") -}}
{{- fail "initContainers cannot mount managed Tailscale state volume tailscale-state" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range .Values.sidecars -}}
{{- if kindIs "map" . -}}
{{- if or (eq (default "" (get . "name")) "tailscale") (eq (default "" (get . "name")) "tailscale-sysctl") -}}
{{- fail (printf "sidecars cannot use managed Tailscale container name %s" (get . "name")) -}}
{{- end -}}
{{- range (default (list) (get . "volumeMounts")) -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "name")) "tailscale-state") -}}
{{- fail "sidecars cannot mount managed Tailscale state volume tailscale-state" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumes -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "name")) "tailscale-state") -}}
{{- fail "extraVolumes cannot use managed Tailscale volume name tailscale-state" -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumeMounts -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "name")) "tailscale-state") -}}
{{- fail "extraVolumeMounts cannot mount managed Tailscale state volume tailscale-state" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $customSharedMemory := false -}}
{{- range .Values.extraVolumeMounts -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "mountPath")) "/dev/shm") -}}
{{- $customSharedMemory = true -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumes -}}
{{- if and (kindIs "map" .) (eq (default "" (get . "name")) "dshm") -}}
{{- $customSharedMemory = true -}}
{{- end -}}
{{- end -}}
{{- range (list .Values.persistence.home .Values.persistence.transfer .Values.persistence.tmp .Values.persistence.hostRoot) -}}
{{- if and (kindIs "map" .) (get . "enabled") (eq (default "" (get . "mountPath")) "/dev/shm") -}}
{{- $customSharedMemory = true -}}
{{- end -}}
{{- end -}}
{{- $managedSharedMemory := and .Values.sharedMemory.enabled (not $customSharedMemory) -}}
{{- if and $sshAuthorizedKeysEnabled (not .Values.persistence.home.enabled) -}}
{{- fail "ssh.authorizedKeys/existingAuthorizedKeysConfigMap requires persistence.home.enabled=true" -}}
{{- end -}}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gpubox.fullname" . }}
  labels:
    {{- include "gpubox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gpubox.serviceName" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.statefulSet.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  podManagementPolicy: {{ .Values.statefulSet.podManagementPolicy }}
  revisionHistoryLimit: {{ .Values.statefulSet.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "gpubox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpubox.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or $dnsEnabled .Values.podAnnotations }}
      annotations:
        {{- if $dnsEnabled }}
        checksum/dns-controller: {{ .Files.Get "files/dns-controller.py" | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- if or $dnsEnabled $tailscaleEnabled }}
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.pod.hostPID }}
      hostPID: true
      {{- end }}
      {{- if .Values.pod.hostNetwork }}
      hostNetwork: true
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
      {{- if .Values.pod.priorityClassName }}
      priorityClassName: {{ .Values.pod.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.pod.runtimeClassName }}
      runtimeClassName: {{ .Values.pod.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gpubox.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $dnsEnabled $tailscaleEnabled $sshAuthorizedKeysEnabled .Values.initContainers }}
      initContainers:
        {{- if $dnsEnabled }}
        - name: dns-setup
          image: "{{ .Values.ssh.initContainer.image.repository }}:{{ .Values.ssh.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.ssh.initContainer.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              chmod 0755 /opt/gpubox-dns
              rm -f /opt/gpubox-dns/.dns-controller.py.new
              cp /opt/gpubox-dns-source/dns-controller.py /opt/gpubox-dns/.dns-controller.py.new
              chmod 0444 /opt/gpubox-dns/.dns-controller.py.new
              mv -f /opt/gpubox-dns/.dns-controller.py.new /opt/gpubox-dns/dns-controller.py
              chmod 0555 /opt/gpubox-dns
              mkdir -p /var/run/gpubox-dns
              chown 0:0 /var/run/gpubox-dns
              chmod 0750 /var/run/gpubox-dns
              chown 65532:65532 /var/run/gpubox-dns
          volumeMounts:
            - name: gpubox-dns-controller-source
              mountPath: /opt/gpubox-dns-source
              readOnly: true
            - name: gpubox-dns-controller
              mountPath: /opt/gpubox-dns
              readOnly: false
            - name: gpubox-dns
              mountPath: /var/run/gpubox-dns
              readOnly: false
        - name: dns-controller
          image: {{ include "gpubox.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              if [ ! -x /usr/bin/python3 ]; then
                echo "dns-controller: /usr/bin/python3 is required in the gpubox image" >&2
                exit 127
              fi
              exec /usr/bin/python3 -I -B /opt/gpubox-dns/dns-controller.py run \
                --state-dir /var/run/gpubox-dns \
                --resolv-conf /etc/resolv.conf \
                --tailscale-socket /var/run/gpubox-tailscale/tailscaled.sock \
                --magicdns-enabled {{ ternary "true" "false" (and $tailscaleEnabled .Values.tailscale.acceptDNS) }}
          startupProbe:
            exec:
              command:
                - /usr/bin/python3
                - -I
                - -B
                - /opt/gpubox-dns/dns-controller.py
                - check-startup
                - --state-dir
                - /var/run/gpubox-dns
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 90
          livenessProbe:
            exec:
              command:
                - /usr/bin/python3
                - -I
                - -B
                - /opt/gpubox-dns/dns-controller.py
                - check-live
                - --state-dir
                - /var/run/gpubox-dns
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: gpubox-dns
              mountPath: /var/run/gpubox-dns
              readOnly: false
            - name: gpubox-dns-controller
              mountPath: /opt/gpubox-dns
              readOnly: true
            - name: gpubox-tailscale-socket
              mountPath: /var/run/gpubox-tailscale
              readOnly: true
          resources:
            {{- toYaml .Values.dns.controller.resources | nindent 12 }}
        - name: dns
          image: {{ include "gpubox.dnsImageRef" . | quote }}
          imagePullPolicy: {{ .Values.dns.image.pullPolicy }}
          restartPolicy: Always
          args:
            - -conf
            - /etc/gpubox-dns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          startupProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: gpubox-dns
              mountPath: /etc/gpubox-dns
              readOnly: true
          resources:
            {{- toYaml .Values.dns.resources | nindent 12 }}
        {{- end }}
        {{- if and $tailscaleEnabled .Values.tailscale.acceptRoutes }}
        - name: tailscale-sysctl
          image: {{ include "gpubox.tailscaleImageRef" . | quote }}
          imagePullPolicy: {{ .Values.tailscale.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.tailscale.sysctl.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              sysctl -w net.ipv4.ip_forward=1
              if sysctl net.ipv6.conf.all.forwarding >/dev/null 2>&1; then
                sysctl -w net.ipv6.conf.all.forwarding=1
              fi
          {{- with .Values.tailscale.sysctl.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $tailscaleEnabled }}
        - name: tailscale
          image: {{ include "gpubox.tailscaleImageRef" . | quote }}
          imagePullPolicy: {{ .Values.tailscale.image.pullPolicy }}
          restartPolicy: Always
          securityContext:
            {{- toYaml .Values.tailscale.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpubox.tailscaleAuthSecretName" . }}
                  key: {{ .Values.tailscale.authKey.secretKey }}
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_STATE_DIR
              value: {{ .Values.tailscale.state.mountPath | quote }}
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            {{- if $dnsEnabled }}
            - name: TS_SOCKET
              value: /var/run/gpubox-tailscale/tailscaled.sock
            {{- end }}
            - name: TS_HOSTNAME
              value: {{ default "$(POD_NAME)" .Values.tailscale.hostname | quote }}
            - name: TS_EXTRA_ARGS
              value: {{ concat (list (printf "--accept-routes=%t" .Values.tailscale.acceptRoutes) "--shields-up=false") .Values.tailscale.extraArgs | join " " | quote }}
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: "127.0.0.1:9002"
            {{- with .Values.tailscale.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - /usr/bin/wget
                - -q
                - --spider
                - http://127.0.0.1:9002/healthz
            initialDelaySeconds: {{ .Values.tailscale.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.tailscale.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.tailscale.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.tailscale.startupProbe.failureThreshold }}
          volumeMounts:
            - name: tailscale-state
              mountPath: {{ .Values.tailscale.state.mountPath | quote }}
              readOnly: false
            {{- if $dnsEnabled }}
            - name: gpubox-tailscale-socket
              mountPath: /var/run/gpubox-tailscale
              readOnly: false
            {{- end }}
          {{- with .Values.tailscale.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $sshAuthorizedKeysEnabled }}
        - name: ssh-authorized-keys
          image: "{{ .Values.ssh.initContainer.image.repository }}:{{ .Values.ssh.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.ssh.initContainer.image.pullPolicy }}
          {{- with .Values.ssh.initContainer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              HOME_DIR="{{ .Values.persistence.home.mountPath }}"
              SSH_DIR="${HOME_DIR}/.ssh"
              mkdir -p "${SSH_DIR}"
              chmod 700 "${SSH_DIR}"
              cp /config/authorized_keys "${SSH_DIR}/authorized_keys"
              chmod 600 "${SSH_DIR}/authorized_keys"
              chown -R {{ .Values.ssh.owner.uid }}:{{ .Values.ssh.owner.gid }} "${SSH_DIR}" || true
          volumeMounts:
            - name: home
              mountPath: {{ .Values.persistence.home.mountPath | quote }}
              readOnly: false
            - name: ssh-authorized-keys
              mountPath: /config
              readOnly: true
            {{- if $dnsEnabled }}
            - name: gpubox-dns
              mountPath: /etc/resolv.conf
              subPath: client-resolv.conf
              readOnly: true
            {{- end }}
          {{- with .Values.ssh.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range .Values.initContainers }}
        {{- if and $dnsEnabled (kindIs "map" .) }}
        {{- $container := deepCopy . }}
        {{- $mounts := default (list) (get $container "volumeMounts") }}
        {{- $_ := set $container "volumeMounts" (append $mounts (dict "name" "gpubox-dns" "mountPath" "/etc/resolv.conf" "subPath" "client-resolv.conf" "readOnly" true)) }}
        {{- if hasKey $container "name" }}
        - name: {{ get $container "name" | quote }}
          {{- $_ := unset $container "name" }}
          {{- toYaml $container | nindent 10 }}
        {{- else }}
        {{- toYaml (list $container) | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
      volumes:
        {{- if $managedSharedMemory }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.persistence.home.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "gpubox.homeClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.transfer.enabled }}
        - name: transfer
          persistentVolumeClaim:
            claimName: {{ include "gpubox.transferClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.tmp.enabled }}
        - name: tmp
          persistentVolumeClaim:
            claimName: {{ include "gpubox.tmpClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.hostRoot.enabled }}
        - name: host-root
          hostPath:
            path: {{ .Values.persistence.hostRoot.hostPath | quote }}
            type: {{ .Values.persistence.hostRoot.type }}
        {{- end }}
        {{- if $sshAuthorizedKeysEnabled }}
        - name: ssh-authorized-keys
          configMap:
            name: {{ include "gpubox.sshAuthorizedKeysConfigMapName" . }}
            items:
              - key: authorized_keys
                path: authorized_keys
        {{- end }}
        {{- if $tailscaleEnabled }}
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: {{ include "gpubox.tailscaleStateClaimName" . }}
        {{- end }}
        {{- if $dnsEnabled }}
        - name: gpubox-dns
          emptyDir: {}
        - name: gpubox-dns-controller
          emptyDir: {}
        - name: gpubox-dns-controller-source
          configMap:
            name: {{ include "gpubox.fullname" . }}-dns-controller
            defaultMode: 0444
            items:
              - key: dns-controller.py
                path: dns-controller.py
        - name: gpubox-tailscale-socket
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ include "gpubox.name" . }}
          image: "{{ include "gpubox.imageRef" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerPorts }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: TUNNEL_NAME
              value: {{ .Values.env.TUNNEL_NAME | quote }}
            - name: WORKDIR
              value: {{ .Values.env.WORKDIR | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if $managedSharedMemory }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- if .Values.persistence.home.enabled }}
            - name: home
              mountPath: {{ .Values.persistence.home.mountPath | quote }}
              readOnly: {{ .Values.persistence.home.readOnly }}
            {{- end }}
            {{- if .Values.persistence.transfer.enabled }}
            - name: transfer
              mountPath: {{ .Values.persistence.transfer.mountPath | quote }}
              readOnly: {{ .Values.persistence.transfer.readOnly }}
            {{- end }}
            {{- if .Values.persistence.tmp.enabled }}
            - name: tmp
              mountPath: {{ .Values.persistence.tmp.mountPath | quote }}
              readOnly: {{ .Values.persistence.tmp.readOnly }}
            {{- end }}
            {{- if .Values.persistence.hostRoot.enabled }}
            - name: host-root
              mountPath: {{ .Values.persistence.hostRoot.mountPath | quote }}
              readOnly: {{ .Values.persistence.hostRoot.readOnly }}
            {{- end }}
            {{- if $dnsEnabled }}
            - name: gpubox-dns
              mountPath: /etc/resolv.conf
              subPath: client-resolv.conf
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          stdin: {{ .Values.container.stdin }}
          tty: {{ .Values.container.tty }}
        {{- range .Values.sidecars }}
        {{- if and $dnsEnabled (kindIs "map" .) }}
        {{- $container := deepCopy . }}
        {{- $mounts := default (list) (get $container "volumeMounts") }}
        {{- $_ := set $container "volumeMounts" (append $mounts (dict "name" "gpubox-dns" "mountPath" "/etc/resolv.conf" "subPath" "client-resolv.conf" "readOnly" true)) }}
        {{- if hasKey $container "name" }}
        - name: {{ get $container "name" | quote }}
          {{- $_ := unset $container "name" }}
          {{- toYaml $container | nindent 10 }}
        {{- else }}
        {{- toYaml (list $container) | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
